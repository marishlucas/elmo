# Builds Ospitio's Elmo images (web, worker, migrate) for linux/amd64 and pushes them to GHCR.
# Runs on every push to the geo-targeting branch or by hand; upstream's publish workflow needs Docker Hub and Blacksmith.
name: Ospitio images

on:
  push:
    branches: [geo-targeting]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker, migrate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/elmo-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/elmo-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=elmo-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=elmo-${{ matrix.target }}
